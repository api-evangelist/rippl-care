description: 'Rippl (Rippl Care) is a specialty healthcare company delivering value-based, virtual-first
  behavioral health and dementia care for older adults and their caregivers. Its clinical model spans
  medication assessments, personalized care plans, counseling, community-resource navigation, and safety
  guidance, partnering with health systems, providers, and payors. Rippl runs its patient portal on
  athenahealth and is backed by GV (Google Ventures); it has no public developer API or developer portal.'
